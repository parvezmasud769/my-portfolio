<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রফেশনাল কুইজ মাস্টার</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            /* ২. ফন্ট ফ্যামিলি আপডেট */
            font-family: 'Hind Siliguri', sans-serif; 
            background-color: #f0f2f5; 
            -webkit-font-smoothing: antialiased;
        }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.7; }
        .progress-bar { transition: width 1s linear; }
        
        /* প্রশ্নের ফন্টকে আরও স্পষ্ট করার জন্য */
        #question {
            line-height: 1.5;
            font-weight: 700;
        }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-2xl mx-auto bg-white p-6 md:p-10 rounded-3xl shadow-2xl text-center relative overflow-hidden">
        <h1 class="text-3xl font-bold mb-2 text-indigo-600">কুইজ মাস্টার</h1>
        <p class="text-gray-500 mb-8 border-b pb-4">নিজেকে যাচাই করুন</p>

        <div id="setup-area">
            <div class="bg-indigo-50 p-6 rounded-2xl mb-6 text-left">
                <label class="block mb-4 text-lg font-semibold text-indigo-900">একটি বিষয় পছন্দ করুন:</label>
                <select id="subject-select" class="w-full p-4 border-2 border-indigo-200 rounded-xl mb-4 text-lg focus:border-indigo-500 outline-none transition-all">
                    <option value="bangla">বাংলা সাহিত্য ও ভাষা</option>
                    <option value="ict">তথ্য ও যোগাযোগ প্রযুক্তি (ICT)</option>
                    <option value="gk">সাধারণ জ্ঞান (GK)</option>
                </select>
            </div>
            <button onclick="startQuiz()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold text-xl hover:bg-indigo-700 transition shadow-lg active:scale-95">কুইজ শুরু করুন</button>
        </div>

        <div id="quiz-area" class="hidden">
            <div class="w-full bg-gray-200 h-2 rounded-full mb-6">
                <div id="timer-bar" class="progress-bar bg-red-500 h-2 rounded-full" style="width: 100%;"></div>
            </div>

            <div class="flex justify-between mb-6 text-sm font-bold">
                <span class="text-indigo-500 bg-indigo-50 px-3 py-1 rounded-full">প্রশ্ন: <span id="q-count">0</span>/১০</span>
                <span id="timer-display" class="text-red-500 bg-red-50 px-3 py-1 rounded-full">সময়: <span id="timer-text">১৫</span> সে.</span>
                <span class="text-emerald-500 bg-emerald-50 px-3 py-1 rounded-full">স্কোর: <span id="score">0</span></span>
            </div>
            
            <div id="question" class="text-xl font-bold mb-8 text-gray-800 text-left leading-relaxed min-h-[80px]"></div>
            <div id="options" class="space-y-4"></div>
            <div id="feedback" class="mt-6 p-4 rounded-xl font-bold hidden"></div>
            
            <button id="next-btn" onclick="loadNextManual()" class="mt-8 bg-indigo-600 text-white px-10 py-4 rounded-xl font-bold w-full hidden shadow-lg uppercase transition-all active:scale-95">পরবর্তী প্রশ্ন</button>
        </div>
        
        <div id="result-card" class="hidden">
            <div class="py-10">
                <div class="text-6xl mb-6">🎉</div>
                <h2 class="text-3xl font-bold mb-2 text-gray-800">কুইজ সম্পন্ন!</h2>
                <div class="bg-gray-50 p-6 rounded-2xl my-6 border-2 border-dashed border-indigo-200">
                    <p id="final-score" class="text-2xl font-bold text-indigo-600 mb-2"></p>
                    <p id="high-score" class="text-gray-500 font-semibold"></p>
                </div>
                <button onclick="startQuiz()" class="bg-indigo-600 text-white px-12 py-4 rounded-xl font-bold w-full hover:bg-indigo-700 transition shadow-md active:scale-95 mb-4">আবার খেলুন (নতুন প্রশ্ন)</button>
                <button onclick="location.reload()" class="text-indigo-600 font-bold border-2 border-indigo-600 px-12 py-4 rounded-xl w-full hover:bg-indigo-50 transition">শুরুতে ফিরে যান</button>
            </div>
        </div>
    </div>

    <script src="bangla.js"></script>
    <script src="ict.js"></script>
    <script src="gk.js"></script>

    <script>
        let selectedQuestions = [];
        let index = 0;
        let score = 0;
        let timeLeft = 15;
        let timerInterval;
        let autoNextTimeout;
        let countdownInterval;

        let answeredQuestions = {
            bangla: [],
            ict: [],
            gk: []
        };

        function startQuiz() {
            const subject = document.getElementById('subject-select').value;
            let allQuestions = [];

            document.getElementById('setup-area').classList.add('hidden');
            document.getElementById('result-card').classList.add('hidden');
            
            try {
                if (subject === 'bangla') allQuestions = banglaQuestions;
                else if (subject === 'ict') allQuestions = ictQuestions;
                else if (subject === 'gk') allQuestions = gkQuestions;

                let newQuestions = allQuestions.filter(q => !answeredQuestions[subject].includes(q.q));

                if (newQuestions.length < 10) {
                    answeredQuestions[subject] = [];
                    newQuestions = allQuestions;
                }

                selectedQuestions = [...newQuestions].sort(() => 0.5 - Math.random()).slice(0, 10);
                selectedQuestions.forEach(q => answeredQuestions[subject].push(q.q));

                document.getElementById('quiz-area').classList.remove('hidden');
                index = 0;
                score = 0;
                document.getElementById('score').innerText = score;
                loadQuestion();
            } catch (e) {
                alert("এরর: ডেটা ফাইল লোড হতে সমস্যা হয়েছে!");
            }
        }

        function loadQuestion() {
            const q = selectedQuestions[index];
            document.getElementById('q-count').innerText = index + 1;
            document.getElementById('question').innerText = q.q;
            
            const optionsDiv = document.getElementById('options');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('next-btn');

            optionsDiv.innerHTML = "";
            feedback.classList.add('hidden');
            nextBtn.classList.add('hidden');

            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full p-4 border-2 border-gray-100 rounded-xl hover:border-indigo-400 hover:bg-indigo-50 transition text-left font-semibold text-gray-700 shadow-sm";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(i, btn);
                optionsDiv.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            timeLeft = 15;
            const timerBar = document.getElementById('timer-bar');
            const timerText = document.getElementById('timer-text');
            clearInterval(timerInterval);
            timerBar.style.width = "100%";
            timerText.innerText = timeLeft;

            timerInterval = setInterval(() => {
                timeLeft--;
                timerText.innerText = timeLeft;
                timerBar.style.width = (timeLeft / 15 * 100) + "%";
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeOut();
                }
            }, 1000);
        }

        function checkAnswer(selected, btn) {
            clearInterval(timerInterval);
            const q = selectedQuestions[index];
            const feedback = document.getElementById('feedback');
            const btns = document.querySelectorAll('.option-btn');
            const nextBtn = document.getElementById('next-btn');
            
            btns.forEach(b => b.disabled = true);
            feedback.classList.remove('hidden');

            if (selected === q.correct) {
                score++;
                document.getElementById('score').innerText = score;
                btn.classList.add('bg-green-50', 'border-green-500', 'text-green-700');
                feedback.innerText = "সঠিক উত্তর! পরবর্তী প্রশ্নে যাচ্ছি...";
                feedback.className = "mt-6 p-4 rounded-xl font-bold bg-green-100 text-green-700 text-center animate-pulse";
                autoNextTimeout = setTimeout(loadNext, 1200);
            } else {
                if(btn) btn.classList.add('bg-red-50', 'border-red-500', 'text-red-700');
                btns[q.correct].classList.add('bg-green-50', 'border-green-500', 'text-green-700');
                feedback.innerText = "ভুল উত্তর!";
                feedback.className = "mt-6 p-4 rounded-xl font-bold bg-red-100 text-red-700 text-center";
                
                nextBtn.classList.remove('hidden');
                let count = 5;
                nextBtn.innerText = `${count} সেকেন্ড পর পরবর্তী প্রশ্ন...`;
                
                countdownInterval = setInterval(() => {
                    count--;
                    nextBtn.innerText = `${count} সেকেন্ড পর পরবর্তী প্রশ্ন...`;
                    if (count <= 0) {
                        clearInterval(countdownInterval);
                        loadNext();
                    }
                }, 1000);
            }
        }

        function handleTimeOut() {
            checkAnswer(-1, null);
        }

        function loadNextManual() {
            clearTimeout(autoNextTimeout);
            clearInterval(countdownInterval);
            loadNext();
        }

        function loadNext() {
            index++;
            if (index < selectedQuestions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz-area').classList.add('hidden');
            document.getElementById('result-card').classList.remove('hidden');
            const subject = document.getElementById('subject-select').value;
            let highScoreKey = "highScore_" + subject;
            let currentHighScore = localStorage.getItem(highScoreKey) || 0;
            if (score > currentHighScore) {
                localStorage.setItem(highScoreKey, score);
                currentHighScore = score;
            }
            document.getElementById('final-score').innerText = "আপনার স্কোর: " + score + " / " + selectedQuestions.length;
            document.getElementById('high-score').innerText = "সেরা স্কোর: " + currentHighScore;
        }
    </script>
</body>
</html>
