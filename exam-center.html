<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সহজ কুইজ সেন্টার</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-md text-center">
        <h1 class="text-2xl font-bold mb-6 text-blue-600">কুইজ সেন্টার</h1>

        <div id="quiz-box">
            <div id="question" class="text-lg font-bold mb-4"></div>
            <div id="options" class="space-y-3"></div>
            <button id="next-btn" onclick="loadRandomQuestion()" class="mt-6 bg-blue-600 text-white px-6 py-2 rounded-lg hidden">পরবর্তী প্রশ্ন</button>
        </div>
    </div>

    <script>
        // এখানে আপনি আপনার সব প্রশ্ন লিখে রাখতে পারেন
        const myQuestions = [
            { q: "বাংলাদেশের রাজধানী কোথায়?", options: ["ঢাকা", "চট্টগ্রাম", "খুলনা", "সিলেট"], correct: 0 },
            { q: "কম্পিউটারের মস্তিষ্ক কাকে বলা হয়?", options: ["RAM", "Monitor", "CPU", "Hard Disk"], correct: 2 },
            { q: "সূর্য কোন দিকে ওঠে?", options: ["পশ্চিম", "উত্তর", "দক্ষিণ", "পূর্ব"], correct: 3 }
        ];

        function loadRandomQuestion() {
            const qIndex = Math.floor(Math.random() * myQuestions.length);
            const q = myQuestions[qIndex];
            
            document.getElementById('question').innerText = q.q;
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = "";

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full p-3 border rounded-lg hover:bg-gray-100 text-left";
                btn.innerText = opt;
                btn.onclick = () => {
                    if(index === q.correct) alert("সঠিক!");
                    else alert("ভুল! সঠিক উত্তর: " + q.options[q.correct]);
                    loadRandomQuestion();
                };
                optionsDiv.appendChild(btn);
            });
        }

        loadRandomQuestion(); // শুরুতেই একটি প্রশ্ন দেখাবে
    </script>
</body>
</html>
