<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বিসিএস বাংলা সাহিত্য কুইজ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f0f4f8; }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.8; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-2xl mx-auto bg-white p-6 md:p-10 rounded-2xl shadow-2xl text-center">
        <h1 class="text-3xl font-bold mb-2 text-indigo-700">বিসিএস বাংলা সাহিত্য কুইজ</h1>
        <p class="text-gray-500 mb-8 border-b pb-4">পিডিএফ থেকে সংগৃহীত গুরুত্বপূর্ণ প্রশ্ন সমাধান</p>

        <div id="quiz-ui">
            <div class="flex justify-between mb-6 text-sm font-bold text-indigo-500 bg-indigo-50 p-3 rounded-lg">
                <span>প্রশ্ন নং: <span id="current-idx">0</span>/৫</span>
                <span>স্কোর: <span id="current-score">0</span></span>
            </div>
            
            <div id="question-text" class="text-xl font-bold mb-8 text-gray-800 leading-relaxed min-h-[80px]">লোড হচ্ছে...</div>
            
            <div id="options-area" class="space-y-4"></div>
            
            <div id="msg-box" class="mt-8 p-4 rounded-xl font-bold hidden"></div>
            
            <button id="next-btn" onclick="goToNext()" class="mt-8 bg-indigo-600 text-white px-12 py-4 rounded-xl font-bold hover:bg-indigo-700 transition w-full hidden shadow-lg uppercase tracking-wider">পরবর্তী প্রশ্ন</button>
            
            <button id="restart-btn" onclick="initQuiz()" class="mt-8 bg-emerald-600 text-white px-12 py-4 rounded-xl font-bold hover:bg-emerald-700 transition w-full hidden shadow-lg uppercase tracking-wider">আবার শুরু করুন</button>
        </div>
    </div>

    <script>
        // পিডিএফ থেকে নেওয়া বাছাইকৃত ৫০টি প্রশ্ন
        const questionBank = [
            { q: "ফররুখ আহমদের 'সাত সাগরের মাঝি' কত সালে প্রকাশিত হয়?", options: ["১৯০৫", "১৯৪০", "১৯৪৪", "১৯৫৫"], correct: 2 },
            { q: "যে আলোতে কুসুম ফোটে এককথায় কী হবে?", options: ["কুমুদ্দিন", "কৌমুদী", "প্রভাবতী", "বিভা"], correct: 1 },
            { q: "বাংলা বর্ণমালার যৌগিক স্বর কয়টি?", options: ["১টি", "২টি", "৩টি", "৪টি"], correct: 1 },
            { q: "ক্রিয়াপদের মূল অংশকে কী বলে?", options: ["কর্ম", "ধাতু", "प्रत्यয়", "বিভক্তি"], correct: 1 },
            { q: "Transparency শব্দের বাংলা পরিভাষা কী?", options: ["যথার্থতা", "নির্ভরযোগ্যতা", "স্বচ্ছতা", "দুর্নীতিদমন"], correct: 2 },
            { q: "'আফতাব' শব্দের সমার্থক শব্দ কোনটি?", options: ["অর্ণব", "রাতুল", "অর্ক", "জলধি"], correct: 2 },
            { q: "ইসমাইল হোসেন সিরাজীর কোন কাব্যটি বাজেয়াপ্ত হয়?", options: ["অনল প্রবাহ", "আকাঙ্ক্ষা", "উদ্বোধন", "নব উদ্দীপনা"], correct: 0 },
            { q: "'ও মন রমজানের ঐ রোজার শেষে এলো খুশির ঈদ'- রচয়িতা কে?", options: ["কাজী নজরুল ইসলাম", "গোলাম মোস্তফা", "জসীমউদ্দীন", "আব্বাস উদ্দীন আহমদ"], correct: 0 },
            { q: "চর্যাপদের প্রাপ্তিস্থান কোথায়?", options: ["বাংলাদেশ", "নেপাল", "উড়িষ্যা", "ভুটান"], correct: 1 },
            { q: "ঈশ্বরচন্দ্র বিদ্যাসাগর কোথায় জন্মগ্রহণ করেন?", options: ["চৌবেরিয়া", "কাঁঠালপাড়া", "বীরসিংহ গ্রাম", "দেবানন্দপুর"], correct: 2 },
            { q: "'হরতাল' কোন ভাষা থেকে আগত শব্দ?", options: ["পর্তুগিজ", "হিন্দি", "গুজরাটি", "ফরাসি"], correct: 2 },
            { q: "কৃদন্ত পদের পূর্ববর্তী পদকে কী বলে?", options: ["উপপদ", "প্রাতিপদিক", "প্রপদ", "পূর্বপদ"], correct: 0 },
            { q: "শামসুর রাহমানের রচিত উপন্যাস কোনটি?", options: ["পতঙ্গ পিঞ্জর", "প্রেম একটি লাল গোলাপ", "রৌদ্র করোটিতে", "অদ্ভুত আঁধার এক"], correct: 3 },
            { q: "রোকিয়া সাখাওয়াত হোসেন রচিত উপন্যাস কোনটি?", options: ["পদ্মাবতী", "পদ্মগোখরা", "পদ্মমণি", "পদ্মরাগ"], correct: 3 },
            { q: "'আগুনপাখি' উপন্যাসটি কে রচনা করেছেন?", options: ["সেলিনা হোসেন", "হাসান আজিজুল হক", "শওকত ওসমান", "হুমায়ূন আহমেদ"], correct: 1 },
            { q: "বাক্যের ক্রিয়ার সাথে অন্যান্য পদের সম্পর্ককে কী বলে?", options: ["বিভক্তি", "কারক", "প্রত্যয়", "অনুসর্গ"], correct: 1 },
            { q: "ঐচ্ছিক শব্দের বিপরীত শব্দ কোনটি?", options: ["অনাবশ্যিক", "আবশ্যিক", "জরুরি", "ইচ্ছাধীন"], correct: 1 },
            { q: "মীর মশাররফ হোসেন রচিত গ্রন্থ কোনটি?", options: ["আলালের ঘরের দুলাল", "হুতোম প্যাঁচার নকশা", "কলিকাতায় কমলালয়", "গাজী মিয়ার বস্তানী"], correct: 3 },
            { q: "একুশে ফেব্রুয়ারির বিখ্যাত গানটির সুরকার কে?", options: ["সুবীর সাহা", "সুধীর দাস", "আলতাফ মাহমুদ", "আলতাফ মামুন"], correct: 2 },
            { q: "বাংলা ভাষায় স্বরধ্বনি উচ্চারণকালে জিহ্বা উচ্চ অবস্থানে থাকে কোনটিতে?", options: ["আ", "এ", "উ", "ও"], correct: 2 },
            { q: "প্রত্যয়যোগে গঠিত শব্দ কোনটি?", options: ["ডাক্তারখানা", "অনুগমন", "দিলখোলা", "সম্রাট"], correct: 0 },
            { q: "বাংলা আদি অধিবাসীগণ কোন ভাষাভাষী ছিল?", options: ["আর্য", "দ্রাবিড়", "অস্ট্রিক", "সংস্কৃত"], correct: 2 },
            { q: "সঞ্চয়িতা কোন কবির কাব্য সংকলন?", options: ["নজরুল ইসলাম", "জীবনানন্দ দাশ", "রবীন্দ্রনাথ ঠাকুর", "সুকুমার রায়"], correct: 2 },
            { q: "জীবনানন্দ দাশের শ্রেষ্ঠ কবিতা কে সম্পাদনা করেন?", options: ["আবদুল মান্নান সৈয়দ", "আবু জাফর ওবায়দুল্লাহ", "আবু সয়ীদ আইয়ুব", "হুমায়ুন আজাদ"], correct: 2 },
            { q: "তৎসম শব্দ কোনটি?", options: ["হস্ত", "পা", "মাথা", "চুল"], correct: 0 },
            { q: "ব্যাকরণের কোন অংশে কারক আলোচিত হয়?", options: ["ধ্বনি তত্ত্ব", "রূপ তত্ত্ব", "বাক্য তত্ত্ব", "অর্থ তত্ত্ব"], correct: 1 },
            { q: "পরাশ্রয়ী বর্ণ কয়টি?", options: ["২টি", "৩টি", "৪টি", "৫টি"], correct: 1 },
            { q: "তপোবন কোন সমাস?", options: ["দ্বিগু", "দ্বন্দ্ব", "চতুর্থী তৎপুরুষ", "বহুব্রীহি"], correct: 2 },
            { q: "পায়ের আওয়াজ পাওয়া যায় নাটকটি কার লেখা?", options: ["মুনীর চৌধুরী", "সৈয়দ শামসুল হক", "সেলিম আল দীন", "আবদুল্লাহ আল মামুন"], correct: 1 },
            { q: "সবুজপত্র পত্রিকা কত সালে প্রকাশিত হয়?", options: ["১৯১০", "১৯১৪", "১৯২১", "১৯৩০"], correct: 1 },
            { q: "কবর কবিতাটি কোন ছন্দে রচিত?", options: ["স্বরবৃত্ত", "মাত্রাবৃত্ত", "অক্ষরবৃত্ত", "গদ্যছন্দ"], correct: 1 },
            { q: "রবীন্দ্রনাথ ঠাকুর কত সালে নোবেল পান?", options: ["১৯১০", "১৯১১", "১৯১৩", "১৯১৫"], correct: 2 },
            { q: "মৈমনসিংহ গীতিকার সংগ্রাহক কে?", options: ["দীনেশচন্দ্র সেন", "চন্দ্রকুমার দে", "মনসুরউদ্দীন", "জসীমউদ্দীন"], correct: 1 },
            { q: "অগ্নিবীণা কাব্যের প্রথম কবিতা কোনটি?", options: ["বিদ্রোহী", "প্রলয়োল্লাস", "আগমনী", "ধূমকেতু"], correct: 1 },
            { q: "বাংলা গদ্যের জনক কে?", options: ["রবীন্দ্রনাথ ঠাকুর", "ঈশ্বরচন্দ্র বিদ্যাসাগর", "প্যারীচাঁদ মিত্র", "বঙ্কিমচন্দ্র"], correct: 1 },
            { q: "কোনটি নজরুল ইসলামের উপন্যাস?", options: ["মৃত্যুক্ষুধা", "চোখের বালি", "পদ্মরাগ", "পথের দাবী"], correct: 0 },
            { q: "জসীমউদ্দীনের জন্মস্থান কোথায়?", options: ["ফরিদপুর", "যশোর", "কুষ্টিয়া", "বরিশাল"], correct: 0 },
            { q: "কোনটি শরৎচন্দ্র চট্টোপাধ্যায়ের ছদ্মনাম?", options: ["ভানুসিংহ", "অনিলা দেবী", "টেকচাঁদ", "বীরবল"], correct: 1 },
            { q: "মুনীর চৌধুরীর কবর নাটকটি কোন পটভূমিতে রচিত?", options: ["৫২ এর ভাষা আন্দোলন", "৭১ এর মুক্তিযুদ্ধ", "তেভাগা আন্দোলন", "উপভাষা"], correct: 0 },
            { q: "বাংলা সাহিত্যের প্রাচীনতম নিদর্শন কোনটি?", options: ["শ্রীকৃষ্ণকীর্তন", "চর্যাপদ", "মৈমনসিংহ গীতিকা", "বৈষ্ণব পদাবলী"], correct: 1 }
        ];

        let selectedQuestions = [];
        let idx = 0;
        let score = 0;

        function initQuiz() {
            // প্রতিবার রেন্ডমলি ১০টি প্রশ্ন বাছাই
            selectedQuestions = [...questionBank].sort(() => 0.5 - Math.random()).slice(0, 10);
            idx = 0;
            score = 0;
            document.getElementById('current-score').innerText = score;
            document.getElementById('restart-btn').classList.add('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const qData = selectedQuestions[idx];
            document.getElementById('current-idx').innerText = idx + 1;
            document.getElementById('question-text').innerText = qData.q;
            
            const optionsDiv = document.getElementById('options-area');
            const msg = document.getElementById('msg-box');
            const next = document.getElementById('next-btn');

            optionsDiv.innerHTML = "";
            msg.classList.add('hidden');
            next.classList.add('hidden');

            qData.options.forEach((opt, i) => {
                const b = document.createElement('button');
                b.className = "option-btn w-full p-4 border-2 border-gray-100 rounded-xl hover:border-indigo-400 hover:bg-indigo-50 transition text-left font-semibold text-gray-700 shadow-sm";
                b.innerText = opt;
                b.onclick = () => handleAnswer(i, b);
                optionsDiv.appendChild(b);
            });
        }

        function handleAnswer(choice, btn) {
            const qData = selectedQuestions[idx];
            const msg = document.getElementById('msg-box');
            const btns = document.querySelectorAll('.option-btn');
            
            btns.forEach(b => b.disabled = true);
            msg.classList.remove('hidden');

            if (choice === qData.correct) {
                score++;
                document.getElementById('current-score').innerText = score;
                btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
                msg.innerText = "সঠিক উত্তর!";
                msg.className = "mt-8 p-4 rounded-xl font-bold bg-emerald-100 text-emerald-700";
            } else {
                btn.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-700');
                btns[qData.correct].classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
                msg.innerText = "ভুল! সঠিক উত্তর: " + qData.options[qData.correct];
                msg.className = "mt-8 p-4 rounded-xl font-bold bg-rose-100 text-rose-700";
            }
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function goToNext() {
            idx++;
            if (idx < selectedQuestions.length) {
                renderQuestion();
            } else {
                document.getElementById('question-text').innerText = "কুইজ শেষ! আপনার মোট স্কোর: " + score + " / " + selectedQuestions.length;
                document.getElementById('options-area').innerHTML = "";
                document.getElementById('msg-box').classList.add('hidden');
                document.getElementById('next-btn').classList.add('hidden');
                document.getElementById('restart-btn').classList.remove('hidden');
            }
        }

        initQuiz();
    </script>
</body>
</html>
