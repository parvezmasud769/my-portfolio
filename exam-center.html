<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tech Leaders Quiz Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Hind Siliguri', sans-serif; 
            background-color: #f0f2f5; 
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.7; }
        .progress-bar { transition: width 1s linear; }
        
        .quiz-container {
            max-height: 95vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        @media (max-width: 640px) {
            .option-btn {
                padding: 0.75rem 1rem !important;
                font-size: 0.95rem !important;
                margin-bottom: 0.5rem !important;
            }
            h1 { font-size: 1.5rem !important; }
            #question { font-size: 1.1rem !important; margin-bottom: 1rem !important; }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-2 md:p-6">

    <div class="quiz-container w-full max-w-xl mx-auto bg-white p-5 md:p-8 rounded-2xl shadow-2xl text-center relative">
        <h1 class="text-2xl font-bold mb-1 text-indigo-600"> মাসুদ'স কুইজ সেন্টার</h1>
        <p class="text-xs text-gray-400 mb-4 border-b pb-2">নিজেকে যাচাই করুন ও জবের জন্য প্রস্তুত করুন</p>

        <div id="setup-area">
            <div class="bg-indigo-50 p-4 rounded-xl mb-4 text-left">
                <label class="block mb-2 text-md font-semibold text-indigo-900">বিষয় পছন্দ করুন:</label>
                <select id="subject-select" class="w-full p-3 border-2 border-indigo-100 rounded-lg text-md focus:border-indigo-500 outline-none">
                    <option value="bangla_grammar">বাংলা ব্যাকরণ</option>
                    <option value="bangla_literature">বাংলা সাহিত্য</option>
                    <option value="ict">তথ্য ও যোগাযোগ প্রযুক্তি</option>
                    <option value="gk">সাধারণ জ্ঞান (GK)</option>
                </select>
            </div>
            <button onclick="startQuiz()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-lg hover:bg-indigo-700 transition active:scale-95">শুরু করুন</button>
        </div>

        <div id="quiz-area" class="hidden">
            <div class="w-full bg-gray-200 h-1.5 rounded-full mb-4">
                <div id="timer-bar" class="progress-bar bg-red-500 h-1.5 rounded-full" style="width: 100%;"></div>
            </div>

            <div class="flex justify-between mb-4 text-xs font-bold">
                <span class="text-indigo-600 bg-indigo-50 px-2 py-1 rounded-md">প্রশ্ন: <span id="q-count">0</span>/১০</span>
                <span id="timer-display" class="text-red-600 bg-red-50 px-2 py-1 rounded-md">সময়: <span id="timer-text">১৫</span>s</span>
                <span class="text-emerald-600 bg-emerald-50 px-2 py-1 rounded-md">স্কোর: <span id="score">0</span></span>
            </div>
            
            <div id="question" class="text-lg font-bold mb-4 text-gray-800 text-left leading-tight min-h-[50px]"></div>
            <div id="options" class="grid grid-cols-1 gap-2"></div>
            
            <div id="feedback" class="mt-3 p-2 text-sm rounded-lg font-bold hidden"></div>
            
            <button id="next-btn" onclick="loadNextManual()" class="mt-4 bg-indigo-600 text-white py-3 rounded-xl font-bold w-full hidden shadow-md active:scale-95">পরবর্তী প্রশ্ন</button>
        </div>
        
        <div id="result-card" class="hidden">
            <div class="py-4">
                <div class="text-4xl mb-2">🎉</div>
                <h2 class="text-xl font-bold mb-1 text-gray-800">কুইজ সম্পন্ন!</h2>
                <div class="bg-gray-50 p-4 rounded-xl my-4 border border-dashed border-indigo-200">
                    <p id="final-score" class="text-lg font-bold text-indigo-600"></p>
                    <p id="high-score" class="text-xs text-gray-500 font-semibold mt-1"></p>
                </div>
                <button onclick="startQuiz()" class="bg-indigo-600 text-white py-3 rounded-xl font-bold w-full mb-2">আবার খেলুন</button>
                <button onclick="location.reload()" class="text-indigo-600 font-bold text-sm py-2 w-full hover:underline">হোমে ফিরে যান</button>
            </div>
        </div>
    </div>

    <script src="bangla_grammar.js"></script>
    <script src="bangla_literature.js"></script>
    <script src="ict.js"></script>
    <script src="gk.js"></script>

    <script>
        let selectedQuestions = [];
        let index = 0;
        let score = 0;
        let timeLeft = 15;
        let timerInterval;
        let autoNextTimeout;
        let countdownInterval;

        // হিস্টোরি ট্র্যাক করার জন্য অবজেক্ট
        let answeredQuestions = { bangla_grammar: [], bangla_literature: [], ict: [], gk: [] };

        function startQuiz() {
            const subject = document.getElementById('subject-select').value;
            let allQuestions = [];
            document.getElementById('setup-area').classList.add('hidden');
            document.getElementById('result-card').classList.add('hidden');
            
            try {
                // সাবজেক্ট অনুযায়ী ডাটা ভ্যারিয়েবল সেট করা
                if (subject === 'bangla_grammar') allQuestions = banglaGrammar;
                else if (subject === 'bangla_literature') allQuestions = banglaLiterature;
                else if (subject === 'ict') allQuestions = ictQuestions;
                else if (subject === 'gk') allQuestions = gkQuestions;

                // নতুন প্রশ্ন ফিল্টার করা
                let newQuestions = allQuestions.filter(q => !answeredQuestions[subject].includes(q.q));
                
                if (newQuestions.length < 10) {
                    answeredQuestions[subject] = [];
                    newQuestions = allQuestions;
                }

                // র‍্যান্ডম ১০টি প্রশ্ন নেওয়া
                selectedQuestions = [...newQuestions].sort(() => 0.5 - Math.random()).slice(0, 10);
                selectedQuestions.forEach(q => answeredQuestions[subject].push(q.q));

                document.getElementById('quiz-area').classList.remove('hidden');
                index = 0; 
                score = 0;
                document.getElementById('score').innerText = score;
                loadQuestion();
            } catch (e) { 
                console.error(e);
                alert("এরর: নিশ্চিত করুন যে সব .js ফাইল এবং ভ্যারিয়েবল নাম সঠিক আছে।"); 
            }
        }

        function loadQuestion() {
            const q = selectedQuestions[index];
            document.getElementById('q-count').innerText = index + 1;
            document.getElementById('question').innerText = q.q;
            const optionsDiv = document.getElementById('options');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('next-btn');

            optionsDiv.innerHTML = "";
            feedback.classList.add('hidden');
            nextBtn.classList.add('hidden');

            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-left p-3 border border-gray-200 rounded-xl hover:bg-indigo-50 transition font-medium text-gray-700";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(i, btn);
                optionsDiv.appendChild(btn);
            });
            startTimer();
        }

        function startTimer() {
            timeLeft = 15;
            const timerBar = document.getElementById('timer-bar');
            const timerText = document.getElementById('timer-text');
            clearInterval(timerInterval);
            timerBar.style.width = "100%";
            timerText.innerText = timeLeft;
            timerInterval = setInterval(() => {
                timeLeft--;
                timerText.innerText = timeLeft;
                timerBar.style.width = (timeLeft / 15 * 100) + "%";
                if (timeLeft <= 0) { clearInterval(timerInterval); handleTimeOut(); }
            }, 1000);
        }

        function checkAnswer(selected, btn) {
            clearInterval(timerInterval);
            const q = selectedQuestions[index];
            const feedback = document.getElementById('feedback');
            const btns = document.querySelectorAll('.option-btn');
            const nextBtn = document.getElementById('next-btn');
            btns.forEach(b => b.disabled = true);
            feedback.classList.remove('hidden');

            if (selected === q.correct) {
                score++;
                document.getElementById('score').innerText = score;
                if(btn) btn.classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                feedback.innerText = "সঠিক উত্তর!";
                feedback.className = "mt-3 p-2 rounded-lg font-bold bg-green-50 text-green-700 text-center text-xs";
                autoNextTimeout = setTimeout(loadNext, 1000);
            } else {
                if(btn) btn.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
                btns[q.correct].classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                feedback.innerText = "ভুল উত্তর!";
                feedback.className = "mt-3 p-2 rounded-lg font-bold bg-red-50 text-red-700 text-center text-xs";
                nextBtn.classList.remove('hidden');
                let count = 4;
                nextBtn.innerText = `${count}s পর পরবর্তী প্রশ্ন`;
                countdownInterval = setInterval(() => {
                    count--;
                    nextBtn.innerText = `${count}s পর পরবর্তী প্রশ্ন`;
                    if (count <= 0) { clearInterval(countdownInterval); loadNext(); }
                }, 1000);
            }
        }

        function handleTimeOut() { checkAnswer(-1, null); }
        function loadNextManual() { clearTimeout(autoNextTimeout); clearInterval(countdownInterval); loadNext(); }
        
        function loadNext() {
            index++;
            if (index < selectedQuestions.length) loadQuestion();
            else showResult();
        }

        function showResult() {
            document.getElementById('quiz-area').classList.add('hidden');
            document.getElementById('result-card').classList.remove('hidden');
            const subject = document.getElementById('subject-select').value;
            let highScoreKey = "highScore_" + subject;
            let currentHighScore = localStorage.getItem(highScoreKey) || 0;
            if (score > currentHighScore) { localStorage.setItem(highScoreKey, score); currentHighScore = score; }
            document.getElementById('final-score').innerText = "স্কোর: " + score + " / " + selectedQuestions.length;
            document.getElementById('high-score').innerText = "সেরা স্কোর: " + currentHighScore;
        }
    </script>
</body>
</html>
