<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রফেশনাল কুইজ সেন্টার</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f3f4f6; }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.8; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-2xl mx-auto bg-white p-6 md:p-10 rounded-3xl shadow-2xl text-center">
        <h1 class="text-3xl font-bold mb-2 text-indigo-600">কুইজ মাস্টার</h1>
        <p class="text-gray-500 mb-8 border-b pb-4">বিষয়ভিত্তিক জ্ঞান যাচাই করুন</p>

        <div id="setup-area">
            <div class="bg-indigo-50 p-6 rounded-2xl mb-6">
                <label class="block mb-4 text-lg font-semibold text-indigo-900">একটি বিষয় পছন্দ করুন:</label>
                <select id="subject-select" class="w-full p-4 border-2 border-indigo-200 rounded-xl mb-4 text-lg focus:border-indigo-500 outline-none transition-all">
                    <option value="bangla">বাংলা সাহিত্য ও ভাষা</option>
                    <option value="ict">তথ্য ও যোগাযোগ প্রযুক্তি (ICT)</option>
                    <option value="gk">সাধারণ জ্ঞান (GK)</option>
                </select>
            </div>
            <button onclick="startQuiz()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold text-xl hover:bg-indigo-700 transition shadow-lg">কুইজ শুরু করুন</button>
        </div>

        <div id="quiz-area" class="hidden">
            <div class="flex justify-between mb-6 text-sm font-bold text-indigo-500 bg-indigo-50 p-3 rounded-lg">
                <span>প্রশ্ন: <span id="q-count">0</span>/১০</span>
                <span>স্কোর: <span id="score">0</span></span>
            </div>
            
            <div id="question" class="text-xl font-bold mb-8 text-gray-800 text-left leading-relaxed min-h-[80px]"></div>
            
            <div id="options" class="space-y-4"></div>
            
            <div id="feedback" class="mt-6 p-4 rounded-xl font-bold hidden"></div>
            
            <button id="next-btn" onclick="loadNext()" class="mt-8 bg-indigo-600 text-white px-10 py-4 rounded-xl font-bold w-full hidden shadow-lg uppercase tracking-wider">পরবর্তী প্রশ্ন</button>
        </div>
        
        <div id="result-card" class="hidden">
            <div class="py-10">
                <div class="text-5xl mb-4">🏆</div>
                <h2 class="text-2xl font-bold mb-2 text-gray-800">অভিনন্দন!</h2>
                <p id="final-score" class="text-lg text-gray-600 mb-8"></p>
                <button onclick="location.reload()" class="bg-emerald-600 text-white px-12 py-4 rounded-xl font-bold w-full hover:bg-emerald-700 transition shadow-md">আবার খেলুন</button>
            </div>
        </div>
    </div>

    <script src="bangla.js"></script>
    <script src="ict.js"></script>
    <script src="gk.js"></script>

    <script>
        let selectedQuestions = [];
        let index = 0;
        let score = 0;

        function startQuiz() {
            const subject = document.getElementById('subject-select').value;
            
            // বিষয় অনুযায়ী ডাটা চেক করা
            try {
                if (subject === 'bangla') selectedQuestions = banglaQuestions;
                else if (subject === 'ict') selectedQuestions = ictQuestions;
                else if (subject === 'gk') selectedQuestions = gkQuestions;

                // বিষয়ভিত্তিক ফাইল থেকে ১০টি রেন্ডম প্রশ্ন বাছাই
                selectedQuestions = [...selectedQuestions].sort(() => 0.5 - Math.random()).slice(0, 10);
                
                document.getElementById('setup-area').classList.add('hidden');
                document.getElementById('quiz-area').classList.remove('hidden');
                loadQuestion();
            } catch (error) {
                alert("দুঃখিত, ওই বিষয়ের ফাইলটি (JS) খুঁজে পাওয়া যায়নি! গিটহাবে ফাইলটি ঠিকঠাক আছে কিনা চেক করুন।");
            }
        }

        function loadQuestion() {
            const q = selectedQuestions[index];
            document.getElementById('q-count').innerText = index + 1;
            document.getElementById('question').innerText = q.q;
            
            const optionsDiv = document.getElementById('options');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('next-btn');

            optionsDiv.innerHTML = "";
            feedback.classList.add('hidden');
            nextBtn.classList.add('hidden');

            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full p-4 border-2 border-gray-100 rounded-xl hover:border-indigo-400 hover:bg-indigo-50 transition text-left font-semibold text-gray-700 shadow-sm";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(i, btn);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected, btn) {
            const q = selectedQuestions[index];
            const feedback = document.getElementById('feedback');
            const btns = document.querySelectorAll('.option-btn');
            
            btns.forEach(b => b.disabled = true);
            feedback.classList.remove('hidden');

            if (selected === q.correct) {
                score++;
                document.getElementById('score').innerText = score;
                btn.classList.add('bg-green-50', 'border-green-500', 'text-green-700');
                feedback.innerText = "সঠিক উত্তর!";
                feedback.className = "mt-6 p-4 rounded-xl font-bold bg-green-100 text-green-700 text-center animate-bounce";
            } else {
                btn.classList.add('bg-red-50', 'border-red-500', 'text-red-700');
                btns[q.correct].classList.add('bg-green-50', 'border-green-500', 'text-green-700');
                feedback.innerText = "ভুল! সঠিক উত্তর: " + q.options[q.correct];
                feedback.className = "mt-6 p-4 rounded-xl font-bold bg-red-100 text-red-700 text-center";
            }
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function loadNext() {
            index++;
            if (index < selectedQuestions.length) {
                loadQuestion();
            } else {
                document.getElementById('quiz-area').classList.add('hidden');
                document.getElementById('result-card').classList.remove('hidden');
                document.getElementById('final-score').innerText = "আপনার মোট স্কোর: " + score + " / " + selectedQuestions.length;
            }
        }
    </script>
</body>
</html>
